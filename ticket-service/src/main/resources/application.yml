server:

  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ticket-service
  jta:
    enabled: true
    transaction-manager-id: ticket-tm
    atomikos:
      properties:
        transaction-manager-unique-name: ${TICKET_ATOMIKOS_TM_UNIQUE_NAME:ticket-service-tm}
        log-base-dir: ${TICKET_ATOMIKOS_LOG_DIR:./data/tx-logs/ticket}
        log-base-name: ${TICKET_ATOMIKOS_LOG_BASE_NAME:tmlog-ticket}
  datasource:
    xa:
      data-source-class-name: org.postgresql.xa.PGXADataSource
      properties:
        serverName: ${TICKET_DB_HOST:localhost}
        portNumber: ${TICKET_DB_PORT:5432}
        databaseName: ${TICKET_DB_NAME:postgres}
        user: ${TICKET_DB_USER:postgres}
        password: ${TICKET_DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        transaction:
          coordinator_class: jta
      jakarta:
        persistence:
          transactionType: JTA
  data:
    web:
      pageable:
        sort-parameter: pageSort

integration:
  bank:
    base-url: http://localhost:8083/api/v1
    username: service_bank
    password: service123
    connect-timeout: 2s
    read-timeout: 5s

security:
  users-xml: ${TICKET_SECURITY_USERS_XML:file:./data/ticket-users.xml}
  users-template: ${TICKET_SECURITY_USERS_TEMPLATE:classpath:security/users.xml}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  exposed-headers: ${CORS_EXPOSED_HEADERS:Location}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  max-age: ${CORS_MAX_AGE:3600}
