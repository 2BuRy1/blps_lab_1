server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: bank-service
  jta:
    enabled: true
    transaction-manager-id: bank-tm
    atomikos:
      properties:
        transaction-manager-unique-name: ${BANK_ATOMIKOS_TM_UNIQUE_NAME:bank-service-tm}
        log-base-dir: ${BANK_ATOMIKOS_LOG_DIR:./data/tx-logs/bank}
        log-base-name: ${BANK_ATOMIKOS_LOG_BASE_NAME:tmlog-bank}
  datasource:
    xa:
      data-source-class-name: org.postgresql.xa.PGXADataSource
      properties:
        serverName: ${BANK_DB_HOST:localhost}
        portNumber: ${BANK_DB_PORT:5432}
        databaseName: studs
        user: ""
        password: ""
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        transaction:
          coordinator_class: jta
      jakarta:
        persistence:
          transactionType: JTA

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    client-id: ticket-service-producer
    acks: all
    retries: 3
  consumer:
    group-id: ticket-service-group
    auto-offset-reset: earliest
    enable-auto-commit: false
    poll-timeout-ms: 1000
  topics:
    payment-request: payment-request-topic
    payment-result: payment-result-topic
    ds-request: 3ds-request-topic
    ds-result: 3ds-result-topic
    retry-request: retry-request-topic
    retry-response: retry-reponse-topic

security:
  users-xml: classpath:security/users.xml

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  exposed-headers: ${CORS_EXPOSED_HEADERS:Location}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  max-age: ${CORS_MAX_AGE:3600}
